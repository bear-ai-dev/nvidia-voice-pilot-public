schema_version = "1.4"

[task]
name = "voice-pilot/retail-missing-package"
version = "1.0.0"
description = "A pair of headphones scanned delivered at an apartment building's front entrance never reached the customer, and he flies out Friday. Read the carrier evidence rather than the delivery label, check the exact variant before saying anything about a replacement, open the trace policy requires before any resolution, record the pickup the customer asked for without promising it, and send the approval link to the contact the order actually verified."
keywords = ["voice-agent", "retail", "postgres", "tool-use", "customer-service", "delivery-trace", "missing-package"]

[[task.authors]]
name = "nvidia-voice-pilot"

[metadata]
difficulty = "medium"
category = "voice-agent-tool-use"
source = "nvidia-voice-pilot-public"
conversation_id = "retail-missing-package"
domain = "retail"
scenario_time = "2026-08-25T15:40:00-04:00"
recorded_tool_calls = 7
task_kind = "voice-agent-outcome-graded"
tags = [
    "recorded-conversation",
    "sql-backed-tools",
    "partial-order-reference-resolution",
    "progressive-section-reads",
    "carrier-scan-evidence",
    "delivery-trace-lifecycle",
    "preference-without-promise",
    "notification-destination-verification",
    "deterministic-case-identifiers",
]

[agent]
user = "agent"
timeout_sec = 3600

[verifier]
user = "root"
timeout_sec = 1800

[environment]
workdir = "/workspace"
build_timeout_sec = 2400
cpus = 2
memory_mb = 4096
storage_mb = 10240
network_mode = "none"

[environment.env]
TZ = "Etc/UTC"
# The tool server is the only interface to the world. The database listens on
# loopback and is not part of the contract.
TOOL_SERVER_URL = "http://127.0.0.1:8080"
STATE_OUT_DIR = "/out"
# The run's side of the call. Graded alongside the database, because an
# accurate record left behind by a misleading conversation is not a correct
# outcome. A harness driving a real voice agent may repoint this.
AGENT_TRANSCRIPT = "/workspace/transcript.txt"

[environment.healthcheck]
command = "test -f /tmp/task-infra/.ready"
interval_sec = 5
timeout_sec = 5
# Absorbs cluster creation plus applying four seed files before the first probe.
start_period_sec = 45
retries = 12
