schema_version = "1.4"

[task]
name = "voice-pilot/pharmacy-travel-refill"
version = "1.0.0"
description = "Get a lost albuterol inhaler back into a patient's hands before he leaves town in the morning: resolve him on name and date of birth against a register that holds another patient of the same name, read why the payer rejected the refill rather than assuming it lapsed, obtain the one override reason this plan approves and spend it exactly once, and set the pickup up at a counter that is still open at the hour he can actually get there."
keywords = ["voice-agent", "pharmacy", "postgres", "tool-use", "customer-service", "prescription", "insurance-claim"]

[[task.authors]]
name = "nvidia-voice-pilot"

[metadata]
difficulty = "medium"
category = "voice-agent-tool-use"
source = "nvidia-voice-pilot-public"
conversation_id = "pharmacy-travel-refill"
domain = "pharmacy"
scenario_time = "2026-08-27T18:12:00-05:00"
recorded_tool_calls = 8
task_kind = "voice-agent-outcome-graded"
tags = [
    "recorded-conversation",
    "sql-backed-tools",
    "identity-resolution",
    "payer-claim-rejection",
    "one-time-override-consumption",
    "prescription-lifecycle",
    "counter-hours-arithmetic",
    "notification-destination-verification",
    "pharmacist-verification-gate",
]

[agent]
user = "agent"
timeout_sec = 3600

[verifier]
user = "root"
timeout_sec = 1800

[environment]
workdir = "/workspace"
build_timeout_sec = 2400
cpus = 2
memory_mb = 4096
storage_mb = 10240
network_mode = "none"

[environment.env]
TZ = "Etc/UTC"
# The tool server is the only interface to the world. The database listens on
# loopback and is not part of the contract.
TOOL_SERVER_URL = "http://127.0.0.1:8080"
STATE_OUT_DIR = "/out"
# The run's side of the call. Graded alongside the database, because an
# accurate record left behind by a misleading conversation is not a correct
# outcome. A harness driving a real voice agent may repoint this.
AGENT_TRANSCRIPT = "/workspace/transcript.txt"

[environment.healthcheck]
command = "test -f /tmp/task-infra/.ready"
interval_sec = 5
timeout_sec = 5
# Absorbs cluster creation plus applying four seed files before the first probe.
start_period_sec = 45
retries = 12
