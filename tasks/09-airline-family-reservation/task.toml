schema_version = "1.4"

[task]
name = "voice-pilot/airline-family-reservation"
version = "1.0.0"
description = "Book two nonstop seats from Phoenix to Washington for a grandmother travelling with her grandson and a folding walker: resolve the airport she actually needs from the neighbourhood she named, price the itinerary she chose with bags, walker, and optional insurance before quoting a figure, verify her before touching her account, confirm what her travel certificate is really worth, and charge the remainder to the card on file without spending the certificate twice."
keywords = ["voice-agent", "airline", "postgres", "tool-use", "customer-service", "reservation", "travel-certificate", "accessibility"]

[[task.authors]]
name = "nvidia-voice-pilot"

[metadata]
difficulty = "medium"
category = "voice-agent-tool-use"
source = "nvidia-voice-pilot-public"
conversation_id = "airline-family-reservation"
domain = "airline"
scenario_time = "2026-08-26T12:30:00-07:00"
recorded_tool_calls = 9
task_kind = "voice-agent-outcome-graded"
tags = [
    "recorded-conversation",
    "sql-backed-tools",
    "destination-area-airport-resolution",
    "fare-quote-arithmetic",
    "mobility-device-tariff",
    "identity-resolution",
    "travel-certificate-drawdown",
    "split-tender-payment",
    "reservation-lifecycle",
    "duplicate-reservation-detection",
]

[agent]
user = "agent"
timeout_sec = 3600

[verifier]
user = "root"
timeout_sec = 1800

[environment]
workdir = "/workspace"
build_timeout_sec = 2400
cpus = 2
memory_mb = 4096
storage_mb = 10240
network_mode = "none"

[environment.env]
TZ = "Etc/UTC"
# The tool server is the only interface to the world. The database listens on
# loopback and is not part of the contract.
TOOL_SERVER_URL = "http://127.0.0.1:8080"
STATE_OUT_DIR = "/out"
# The run's side of the call. Graded alongside the database, because an
# accurate record left behind by a misleading conversation is not a correct
# outcome. A harness driving a real voice agent may repoint this.
AGENT_TRANSCRIPT = "/workspace/transcript.txt"

[environment.healthcheck]
command = "test -f /tmp/task-infra/.ready"
interval_sec = 5
timeout_sec = 5
# Absorbs cluster creation plus applying four seed files before the first probe.
# The airline seed is larger than the pharmacy one, mostly flight availability.
start_period_sec = 60
retries = 12
