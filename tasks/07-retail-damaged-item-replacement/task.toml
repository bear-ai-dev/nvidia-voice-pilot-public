schema_version = "1.4"

[task]
name = "voice-pilot/retail-damaged-item-replacement"
version = "1.0.0"
description = "A coffee maker arrived with a cracked water tank, from a customer who called yesterday about a different order entirely. Read what the damage claim actually unlocks rather than offering what the customer asked for, create the replacement at the price already paid, and keep it away from the pickup preference sitting on yesterday's still-open missing-package trace."
keywords = ["voice-agent", "retail", "postgres", "tool-use", "customer-service", "replacement-order", "damaged-item"]

[[task.authors]]
name = "nvidia-voice-pilot"

[metadata]
difficulty = "medium"
category = "voice-agent-tool-use"
source = "nvidia-voice-pilot-public"
conversation_id = "retail-damaged-item-replacement"
domain = "retail"
scenario_time = "2026-08-26T11:20:00-04:00"
recorded_tool_calls = 7
task_kind = "voice-agent-outcome-graded"
tags = [
    "recorded-conversation",
    "sql-backed-tools",
    "partial-order-reference-resolution",
    "progressive-section-reads",
    "replacement-order-creation",
    "deterministic-order-identifiers",
    "cross-case-isolation",
    "carried-over-case-state",
    "notification-delivery-refresh",
]

[agent]
user = "agent"
timeout_sec = 3600

[verifier]
user = "root"
timeout_sec = 1800

[environment]
workdir = "/workspace"
build_timeout_sec = 2400
cpus = 2
memory_mb = 4096
storage_mb = 10240
network_mode = "none"

[environment.env]
TZ = "Etc/UTC"
# The tool server is the only interface to the world. The database listens on
# loopback and is not part of the contract.
TOOL_SERVER_URL = "http://127.0.0.1:8080"
STATE_OUT_DIR = "/out"
# The run's side of the call. Graded alongside the database, because an
# accurate record left behind by a misleading conversation is not a correct
# outcome. A harness driving a real voice agent may repoint this.
AGENT_TRANSCRIPT = "/workspace/transcript.txt"

[environment.healthcheck]
command = "test -f /tmp/task-infra/.ready"
interval_sec = 5
timeout_sec = 5
# Absorbs cluster creation plus applying four seed files before the first probe.
start_period_sec = 45
retries = 12
